# 週報（設計書 §2「週1回（日曜の夜）」）：日曜 21:07 JST に、数字を集めて Claude が週報を書き、Issue にする
# ・書く作業（claude -p）には Claude のトークンだけが渡る（weekly.py が子のプロセスから他の鍵を消す）
# ・YouTube の鍵は「時間帯の数字を取る」（slot_stats.py。アナリティクスを読むだけ）の段だけで使い、週報を書く前に消す（2026-11-04〜）
# ・枠は weekly。cancel-in-progress: false
# ・まだ無いもの：UTAGE の流入経路づくり・LINE の声の取り込み・特典の作り直し（UTAGE をつなぐ時に足す）
name: weekly
on:
  schedule:
    - cron: "7 12 * * 0"   # 日曜 21:07 JST
  workflow_dispatch:
    inputs:
      stats_only:
        description: "時間帯の数字を取るだけ（週報は書かない。2026-11-04 の試し用）"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
      MONTHLY_CAP_YEN: ${{ vars.MONTHLY_CAP_YEN }}
      STOCK_PHASE: ${{ vars.STOCK_PHASE }}
      CLAUDE_TOKEN_ISSUED: ${{ vars.CLAUDE_TOKEN_ISSUED }}
      CHANNELS: job psy spi kakure shimei nihongi okinu   # spi は 2026-11-11 から翠仙（千年こよみから替えた。history/spi/学び.md を新しく書く。手順書はまだ無く決まりは research.py の SPI_RULES）。psy は history/psy/学び.md も書く（毎日の台本の書き手が読む）
      # kakure・shimei・nihongi・okinu は 2026-11-04 から（健康・数字・時間帯の節だけ。weekly.py の FULL）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 道具を入れる（版を固定）
        if: ${{ !inputs.stats_only }}
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Claude のアカウントを選ぶ（pipeline/pick_claude.sh。CLAUDE_SUB_UNTIL を過ぎたら元で試し、使えなければ新しい方）
        if: ${{ !inputs.stats_only }}
        env:
          MAIN_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HAS_SUB: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_SUB != '' }}
          CLAUDE_ACCOUNT: ${{ vars.CLAUDE_ACCOUNT }}
          CLAUDE_SUB_UNTIL: ${{ vars.CLAUDE_SUB_UNTIL }}
        run: bash pipeline/pick_claude.sh
      - name: Claude の入口を PATH の先頭に置く（pipeline/bin/claude。上限・ログイン切れで止まったら、もう一方のアカウントで頼み直す）
        run: echo "$GITHUB_WORKSPACE/pipeline/bin" >> "$GITHUB_PATH"
      - name: YouTube の鍵を置く（時間帯の数字を取る段だけで使う。中身は画面に出さない）
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_JOB: ${{ secrets.YT_TOKEN_JOB }}
          YT_TOKEN_SPI: ${{ secrets.YT_TOKEN_SPI }}
          YT_TOKEN_PSY: ${{ secrets.YT_TOKEN_PSY }}
          YT_TOKEN_NIHONGI: ${{ secrets.YT_TOKEN_NIHONGI }}
          YT_TOKEN_OKINU: ${{ secrets.YT_TOKEN_OKINU }}
          YT_TOKEN_KAKURE: ${{ secrets.YT_TOKEN_KAKURE }}
          YT_TOKEN_SHIMEI: ${{ secrets.YT_TOKEN_SHIMEI }}
        run: |
          YT_SECRETS_DIR="$RUNNER_TEMP/secrets" && echo "YT_SECRETS_DIR=$YT_SECRETS_DIR" >> "$GITHUB_ENV"
          mkdir -p "$YT_SECRETS_DIR" && chmod 700 "$YT_SECRETS_DIR"
          printf '%s' "$YT_CLIENT_SECRET" > "$YT_SECRETS_DIR/client_secret.json"
          [ -n "$YT_TOKEN_JOB" ] && printf '%s' "$YT_TOKEN_JOB" > "$YT_SECRETS_DIR/token_job.json"
          [ -n "$YT_TOKEN_SPI" ] && printf '%s' "$YT_TOKEN_SPI" > "$YT_SECRETS_DIR/token_spi.json"
          [ -n "$YT_TOKEN_PSY" ] && printf '%s' "$YT_TOKEN_PSY" > "$YT_SECRETS_DIR/token_psy.json"
          [ -n "$YT_TOKEN_NIHONGI" ] && printf '%s' "$YT_TOKEN_NIHONGI" > "$YT_SECRETS_DIR/token_nihongi.json"
          [ -n "$YT_TOKEN_OKINU" ] && printf '%s' "$YT_TOKEN_OKINU" > "$YT_SECRETS_DIR/token_okinu.json"
          [ -n "$YT_TOKEN_KAKURE" ] && printf '%s' "$YT_TOKEN_KAKURE" > "$YT_SECRETS_DIR/token_kakure.json"
          [ -n "$YT_TOKEN_SHIMEI" ] && printf '%s' "$YT_TOKEN_SHIMEI" > "$YT_SECRETS_DIR/token_shimei.json"
          chmod 600 "$YT_SECRETS_DIR"/*
      - name: 時間帯の数字を取る（pipeline/slot_stats.py。失敗しても週報は書く）
        run: python -X utf8 pipeline/slot_stats.py $CHANNELS || true
      - name: YouTube の鍵を消す（Claude が動く前）
        if: always()
        run: rm -rf "$RUNNER_TEMP/secrets"
      - name: 週報を書く
        if: ${{ !inputs.stats_only }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.CLAUDE_PICK == 'sub' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SUB || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_TOKEN_ALT: ${{ env.CLAUDE_PICK == 'sub' && secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_CODE_OAUTH_TOKEN_SUB }}
          GH_TOKEN: ${{ github.token }}
          HC_WEEKLY: ${{ secrets.HC_PING_WEEKLY }}   # 無くてもよい（無ければ合図を送らない。週報の見張りは watch がする）
        run: python -X utf8 pipeline/weekly.py $CHANNELS
      - name: 記録を commit する（ぶつかったら最新を取り込んで5回まで）
        if: always()
        run: |
          git config user.name "yt-auto"
          git config user.email "yt-auto@users.noreply.github.com"
          git add history
          git diff --cached --quiet && exit 0
          git commit -qm "週報：$(date +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash -X theirs && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*10)); done
          exit 1
