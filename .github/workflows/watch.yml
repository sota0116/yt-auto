# 見張り（設計書 §2「毎日（数字の見張り。12:07 JST）」・§4「見張り役どうしで見張る」）
# ・上げた動画の状態（公開されたか）・コメント・72時間後と7日後の数字と差し替え・在庫と予約・毎日の実行と週報の見張り
# ・枠は watch（毎日の実行とぶつからない）。cancel-in-progress: false
# ・サムネB案は作業フォルダ（actions/cache）から読むだけ。キャッシュは保存しない（毎日の実行の続きを壊さないため）
# ・PAUSED の間も見張りは動かす（止めるのは新しく作ることだけ。公開は在庫で続くので見張りが要る）
name: watch
on:
  schedule:
    - cron: "7 3 * * *"   # 12:07 JST
    - cron: "7 9 * * *"   # 18:07 JST（やり直し。GitHub の定時が来ない日があった（10/26）。明日の予約は無い時だけ入れるので、2回動いても重ならない）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      STOCK_PHASE: ${{ vars.STOCK_PHASE }}
      AXIS_TYPES: ${{ vars.AXIS_TYPES }}
      PUBLISH_TIME: ${{ vars.PUBLISH_TIME }}
      CHANNELS: job   # スピ（spi）は毎日の実行に足す時に、ここにも足す（例：job spi）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 作業フォルダを読む（サムネB案のため）
        uses: actions/cache/restore@v4
        with:
          path: channels/job/videos
          key: work-job-watch-${{ github.run_id }}
          restore-keys: work-job-
      - name: 鍵を置く（中身は画面に出さない）
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_JOB: ${{ secrets.YT_TOKEN_JOB }}
          YT_TOKEN_SPI: ${{ secrets.YT_TOKEN_SPI }}
        run: |
          YT_SECRETS_DIR="$RUNNER_TEMP/secrets" && echo "YT_SECRETS_DIR=$YT_SECRETS_DIR" >> "$GITHUB_ENV"
          mkdir -p "$YT_SECRETS_DIR" && chmod 700 "$YT_SECRETS_DIR"
          printf '%s' "$YT_CLIENT_SECRET" > "$YT_SECRETS_DIR/client_secret.json"
          [ -n "$YT_TOKEN_JOB" ] && printf '%s' "$YT_TOKEN_JOB" > "$YT_SECRETS_DIR/token_job.json"
          [ -n "$YT_TOKEN_SPI" ] && printf '%s' "$YT_TOKEN_SPI" > "$YT_SECRETS_DIR/token_spi.json"
          chmod 600 "$YT_SECRETS_DIR"/*
      - name: 見張る
        env:
          GH_TOKEN: ${{ github.token }}
          HC_WATCH: ${{ secrets.HC_PING_WATCH }}   # 鍵の名前は鍵ファイル（keys.env）に合わせる
        run: python -X utf8 pipeline/watch.py $CHANNELS
      - name: 記録を commit する（ぶつかったら最新を取り込んで5回まで）
        if: always()
        run: |
          git config user.name "yt-auto"
          git config user.email "yt-auto@users.noreply.github.com"
          git add history
          git diff --cached --quiet && exit 0
          git commit -qm "見張り：$(date +%F_%H%M)"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*10)); done
          exit 1
      - name: 鍵を消す
        if: always()
        run: rm -rf "$RUNNER_TEMP/secrets"
