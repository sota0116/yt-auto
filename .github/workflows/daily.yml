# 毎日の制作（設計書 §2・§4）。02:07 JST に作り、08:07 JST と 17:37 JST に失敗した回だけ続きからやり直す
# ・17:37 は Gemini の1日の回数の上限で止まった回のため（上限は16時か17時に戻る。08:07 では戻っていない）
# ・チャンネルごとに別の枠（daily-job・daily-spi）。上限は各4時間（型D は長いので 300分）
# ・鍵は GitHub の Secrets、止めるスイッチと上限額は Variables（PAUSED・MONTHLY_CAP_YEN・STOCK_PHASE・COST_FACTOR）
# ・書く作業（claude -p）には Claude のトークンだけが渡る（write_script.py が子のプロセスから他の鍵を消す）
# ・声は VOICEVOX ENGINE をサービスのコンテナで動かす（お金・回数の上限なし）。台本・絵・完成品のゲートは Claude（2026-10-24 まで Gemini）
# ・リポジトリは公開。動画スキル（配布物）は Secrets の VENDOR_SKILL_B64 から戻す
# ・作業フォルダは actions/cache で次の実行に引き継ぐ（やり直しで続きから始めるため）。記録（history/）は commit する
name: daily
on:
  schedule:
    - cron: "7 17 * * *"   # 02:07 JST
    - cron: "7 23 * * *"   # 08:07 JST（やり直し）
    - cron: "37 8 * * *"   # 17:37 JST（Gemini の1日の上限が戻った後の続き。上限は日本時間の16時（夏時間）か17時に戻る）
    - cron: "37 3 * * *"   # 12:37 JST（続き。心理学chは1本に絵が約190枚あり、Lovart の無料の順番待ちで6〜8時間かかる。空いている時間を埋めて毎日1本を保つ。2026-10-28）
    - cron: "47 13 * * *"  # 22:47 JST（同じ。リポジトリは公開なので実行の時間は無料。作るのは在庫が足りない時だけ（profile.json の stock_goal））
  workflow_dispatch:
    inputs:
      count:
        description: "auto か 本数"
        default: "auto"
      ch:
        description: "all か チャンネル（job・psy・spi・nihongi）。手で1つだけ回す時"
        default: "all"

permissions:
  contents: write
  issues: write

jobs:
  make:
    strategy:
      fail-fast: false
      matrix:
        # 心理学（psy）は 2026-10-27 から毎日公開。千年こよみ（spi）は 2026-10-29 から（週4本・月水金日 18:00）。アナザー日本紀（nihongi）は 2026-10-30 から（ショート毎日2本＋横動画2日に1本。profile.json の kinds）
        ch: ${{ fromJSON((inputs.ch && inputs.ch != 'all') && format('["{0}"]', inputs.ch) || '["job", "psy", "spi", "nihongi"]') }}
    concurrency:
      group: daily-${{ matrix.ch }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    services:
      voicevox:   # 声（2026-10-24 から VOICEVOX。版を固定。0.26.0 は公開が 2026-10-19 で新しすぎるので 0.25.2）
        image: voicevox/voicevox_engine:cpu-0.25.2
        ports:
          - 50021:50021
    env:
      TZ: Asia/Tokyo
      PAUSED: ${{ vars.PAUSED }}
      MONTHLY_CAP_YEN: ${{ vars.MONTHLY_CAP_YEN }}
      STOCK_PHASE: ${{ vars.STOCK_PHASE }}
      COST_FACTOR: ${{ vars.COST_FACTOR }}
      VOICEVOX_URL: http://127.0.0.1:50021
      LOVART_SKILL: ${{ github.workspace }}/vendor/lovart/agent_skill.py
      SLOT: ${{ (github.event.schedule == '7 23 * * *' || github.event.schedule == '37 3 * * *' || github.event.schedule == '47 13 * * *') && 'retry' || github.event.schedule == '37 8 * * *' && 'late' || 'first' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 枠の順番待ちをした回は、待ち始めた時の古い記録（history/）を取り出してしまい、上げ終えた回の続きを作ろうとして止まった（2026-10-26）。始まる時の最新を取る
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 道具を入れる（版を固定）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          sudo apt-get install -y -qq fonts-morisawa-bizud-gothic || echo "BIZ UDゴシックが入らないので Noto で作る"   # 心理学ch の研究カード・章タイトル（001 と同じ字）
          pip install -q -r requirements.txt
          npm install -g @anthropic-ai/claude-code@2.1.296
          # spi の動く図解カードは Playwright で Chrome を動かす（runner に入っている /usr/bin/google-chrome を使う。build_long_spi.py）
          test -x /usr/bin/google-chrome || python -m playwright install --with-deps chromium
      - name: 動画スキルを置く（生徒さん向けの配布物なので公開リポジトリには入れず、Secrets から戻す）
        env:
          VENDOR_SKILL_B64: ${{ secrets.VENDOR_SKILL_B64 }}
        run: |
          mkdir -p vendor/youtube-video-maker
          printf '%s' "$VENDOR_SKILL_B64" | base64 -d | tar -xz -C vendor/youtube-video-maker
          test -f vendor/youtube-video-maker/scripts/build_long.py
      - name: spi の BGM を戻す（甘茶の音楽工房の曲。規約が「音楽だけの配布」を禁じるので、公開リポジトリには暗号にして置き、鍵は Secrets）
        if: matrix.ch == 'spi'
        env:
          SPI_BGM_PASS: ${{ secrets.SPI_BGM_PASS }}
        run: |
          # 鍵か暗号のファイルが無い時は、ここでは止めない（ネタ・台本・絵は先に作る。組み立て build_long_spi.py が BGM 無しで止まる）
          f=channels/spi/assets/bgm/koyomi_bgm_02_amacha3.m4a.gpg
          { [ -n "$SPI_BGM_PASS" ] && [ -f "$f" ]; } || { echo "::warning::spi の BGM の鍵（SPI_BGM_PASS）か $f がありません。組み立ての手前で止まります"; exit 0; }
          printf '%s' "$SPI_BGM_PASS" | gpg -q --batch --pinentry-mode loopback --passphrase-fd 0 -o "$RUNNER_TEMP/spi_bgm.m4a" -d "$f"
          echo "SPI_BGM=$RUNNER_TEMP/spi_bgm.m4a" >> "$GITHUB_ENV"
      - name: 作業フォルダを引き継ぐ
        uses: actions/cache/restore@v4
        with:
          path: channels/${{ matrix.ch }}/videos
          key: work-${{ matrix.ch }}-${{ github.run_id }}
          restore-keys: work-${{ matrix.ch }}-
      - name: 鍵を置く（中身は画面に出さない）
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          # チャンネルごとのログイン。無いチャンネルは空になり、下で止まる（前は job・psy 以外が全部 spi のログインになっていた。2026-10-29）
          YT_TOKEN: ${{ matrix.ch == 'job' && secrets.YT_TOKEN_JOB || matrix.ch == 'psy' && secrets.YT_TOKEN_PSY || matrix.ch == 'spi' && secrets.YT_TOKEN_SPI || matrix.ch == 'nihongi' && secrets.YT_TOKEN_NIHONGI || matrix.ch == 'okinu' && secrets.YT_TOKEN_OKINU || '' }}
        run: |
          [ -n "$YT_TOKEN" ] || { echo "【止まりました】${{ matrix.ch }} の YouTube のログイン（YT_TOKEN_<チャンネル>）が GitHub の Secrets にありません"; exit 1; }
          YT_SECRETS_DIR="$RUNNER_TEMP/secrets" && echo "YT_SECRETS_DIR=$YT_SECRETS_DIR" >> "$GITHUB_ENV"
          mkdir -p "$YT_SECRETS_DIR" && chmod 700 "$YT_SECRETS_DIR"
          printf '%s' "$YT_CLIENT_SECRET" > "$YT_SECRETS_DIR/client_secret.json"
          printf '%s' "$YT_TOKEN" > "$YT_SECRETS_DIR/token_${{ matrix.ch }}.json"
          chmod 600 "$YT_SECRETS_DIR"/*
      - name: 作る
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOVART_ACCESS_KEY: ${{ secrets.LOVART_ACCESS_KEY }}
          LOVART_SECRET_KEY: ${{ secrets.LOVART_SECRET_KEY }}
        run: python -X utf8 pipeline/run_daily.py ${{ matrix.ch }} --slot "$SLOT" --count "${{ inputs.count || 'auto' }}"
      - name: Lovart を無料モードに戻す（詰まりを取る間に落ちた時だけ。pipeline/lovart_boost.py）
        if: always()
        env:
          LOVART_ACCESS_KEY: ${{ secrets.LOVART_ACCESS_KEY }}
          LOVART_SECRET_KEY: ${{ secrets.LOVART_SECRET_KEY }}
        run: python -X utf8 pipeline/lovart_boost.py restore
      - name: 作業フォルダを保存する
        if: always()
        uses: actions/cache/save@v4
        with:
          path: channels/${{ matrix.ch }}/videos
          key: work-${{ matrix.ch }}-${{ github.run_id }}
      - name: 記録を commit する（ぶつかったら最新を取り込んで5回まで）
        if: always()
        run: |
          git config user.name "yt-auto"
          git config user.email "yt-auto@users.noreply.github.com"
          git add history
          git diff --cached --quiet && exit 0
          git commit -qm "記録：${{ matrix.ch }} $(date +%F_%H%M)"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*10)); done
          exit 1
      - name: 通知
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HC_DAILY_JOB: ${{ secrets.HC_PING_DAILY_JOB }}   # 鍵の名前は鍵ファイル（keys.env）に合わせる
          HC_DAILY_SPI: ${{ secrets.HC_PING_DAILY_SPI }}
          HC_DAILY_PSY: ${{ secrets.HC_PING_DAILY_PSY }}   # 無ければ送らない
          HC_DAILY_NIHONGI: ${{ secrets.HC_PING_DAILY_NIHONGI }}
        run: python -X utf8 pipeline/notify.py daily ${{ matrix.ch }} --slot "$SLOT"
      - name: 鍵を消す
        if: always()
        run: rm -rf "$RUNNER_TEMP/secrets"
