# 競合リサーチ（毎日 01:17 JST。02:07 の毎日の制作の前に、その日の台本が新しい競合メモを読めるように）
# ・YouTube は読むだけ（1日 約650回分。お金なし）。まとめは Claude（鍵は渡さない。research.py が子のプロセスから消す）
# ・書くのは history/<ch>/competitors/ だけ（集めた物・競合メモ・その日付の写し）。サムネは _research/ に置き、commit しない
# ・心理学ch（psy。2026-10-27 から）は、ネタ帳の残りが少ない時に channels/psy/ネタ帳.json にも候補を足す（research.py の add_neta）
# ・PAUSED の間も動かす（読むだけなので）
# ・調べたあと、仕事ch の毎日の学び（learn_job.py。history/job/学び.md）も書く（2026-10-28 本人「毎日レベル上げてね」）
name: research
on:
  schedule:
    - cron: "17 16 * * *"   # 01:17 JST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 100  # 2チャンネル分（Claude のまとめが1つ最大30分）＋学び（最大20分）
    env:
      TZ: Asia/Tokyo
      CHANNELS: job psy spi nihongi okinu   # nihongi・okinu は 2026-10-29 に competitors.json を作って足した。 spi（千年こよみ）は 2026-10-29 に channels/spi/competitors.json を作って足した
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 道具を入れる（版を固定）
        run: |
          pip install -q -r requirements.txt
          npm install -g @anthropic-ai/claude-code@2.1.296
      - name: 鍵を置く（中身は画面に出さない）
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_JOB: ${{ secrets.YT_TOKEN_JOB }}
          YT_TOKEN_SPI: ${{ secrets.YT_TOKEN_SPI }}
          YT_TOKEN_PSY: ${{ secrets.YT_TOKEN_PSY }}
        run: |
          YT_SECRETS_DIR="$RUNNER_TEMP/secrets" && echo "YT_SECRETS_DIR=$YT_SECRETS_DIR" >> "$GITHUB_ENV"
          mkdir -p "$YT_SECRETS_DIR" && chmod 700 "$YT_SECRETS_DIR"
          printf '%s' "$YT_CLIENT_SECRET" > "$YT_SECRETS_DIR/client_secret.json"
          [ -n "$YT_TOKEN_JOB" ] && printf '%s' "$YT_TOKEN_JOB" > "$YT_SECRETS_DIR/token_job.json"
          [ -n "$YT_TOKEN_SPI" ] && printf '%s' "$YT_TOKEN_SPI" > "$YT_SECRETS_DIR/token_spi.json"
          [ -n "$YT_TOKEN_PSY" ] && printf '%s' "$YT_TOKEN_PSY" > "$YT_SECRETS_DIR/token_psy.json"
          chmod 600 "$YT_SECRETS_DIR"/*
      - name: 調べる
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          bad=0
          for ch in $CHANNELS; do python -X utf8 pipeline/research.py "$ch" || bad=1; done
          exit $bad
      - name: 学ぶ（仕事ch。うちの回の数字から、次の回で試すことを1つ決める。learn_job.py）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python -X utf8 pipeline/learn_job.py job
      - name: 記録を commit する（ぶつかったら最新を取り込んで5回まで）
        if: always()
        run: |
          git config user.name "yt-auto"
          git config user.email "yt-auto@users.noreply.github.com"
          git add history channels/psy/ネタ帳.json
          git diff --cached --quiet && exit 0
          git commit -qm "競合リサーチ：$(date +%F_%H%M)"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*10)); done
          exit 1
      - name: 鍵を消す
        if: always()
        run: rm -rf "$RUNNER_TEMP/secrets"
