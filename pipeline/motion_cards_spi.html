<body class="kinun"><div id="bg"></div><div id="grain"></div><div id="dust"></div><div id="zoom"><div id="stage"></div></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,s,d)=>clamp((t-s)/d);
const out=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const inout=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CARD=null,DUR=5,ZOOM=0;
const stage=document.getElementById('stage');
function H(html,parent=stage){const d=document.createElement('div');d.innerHTML=html.trim();const e=d.firstChild;parent.appendChild(e);return e}
function show(e,a,dx=0,dy=0){e.style.opacity=a;e.style.transform=`translate(${dx}px,${dy}px)`}
// 1文字ずつのspan。accent の部分は朱色＋下線
function chars(text,accent){
  const i=accent?text.indexOf(accent):-1;let h='';
  [...text].forEach((c,k)=>{
    if(i>=0&&k===i)h+='<span class="acc">';
    h+=`<span class="ch">${c==='　'||c===' '?'&nbsp;':esc(c)}</span>`;
    if(i>=0&&k===i+[...accent].length-1)h+='<span class="ul"></span></span>';
  });return h}
function stagger(root,t,t0,step,dy=24){root.querySelectorAll('.ch').forEach((c,k)=>{const a=out(P(t,t0+k*step,.35));c.style.opacity=a;c.style.transform=`translateY(${(1-a)*dy}px)`})}
function fit(e,maxW){let fs=parseFloat(getComputedStyle(e).fontSize);while(e.scrollWidth>maxW&&fs>36){fs-=4;e.style.fontSize=fs+'px'}}

const BILL={'10000':['var(--b10000)','一万円'],'1000':['var(--b1000)','千円'],'5000':['#C9B7D3','五千円']};
const CARDS={
photo(s){
  // v6（2026-10-27）：s.video があれば、絵の代わりに動く絵（Kling の5秒動画）を下地にする。カットが長い時はゆっくり再生、さらに長い時は往復
  const media=s.video?`<video src="${s.video}" muted preload="auto" playsinline></video>`:`<img src="${s.src}">`;
  const root=H(`<div class="abs ${s.frame==='old'?'old':''}" style="inset:0"><div class="ph">${media}</div>${s.frame==='old'?'':'<div class="grad"></div>'}</div>`);
  const img=root.querySelector(s.video?'video':'img'),ph=root.querySelector('.ph');
  const ready=s.video?new Promise(r=>{if(img.readyState>=2)r();else{img.onloadeddata=r;img.onerror=r}})
    :new Promise(r=>{if(img.complete)r();else{img.onload=r;img.onerror=r}});
  const seek=t=>{const vd=Math.max(.5,(img.duration||5)-.08);let vt;
    if(DUR<=vd*1.7)vt=t*vd/DUR;else{const u=(t/1.3)%(2*vd);vt=u<=vd?u:2*vd-u}
    vt=Math.min(vd,Math.max(0,vt));if(Math.abs(img.currentTime-vt)<1e-3)return null;
    return new Promise(r=>{img.onseeked=()=>r(true);img.currentTime=vt})};
  const tag=s.tag?H(`<div class="tag"><b>${esc(s.tag)}</b>${s.tag_sub?`<span>${esc(s.tag_sub)}</span>`:''}</div>`):null;
  const nm=s.name?H(`<div class="nameplate"><span class="role">${esc(s.role||'')}</span><b>${esc(s.name)}</b></div>`):null;
  // pop：{small, big, side:"r"|"l", size:大きい字のpx（既定140）}。右上（side l なら左上）に、朱の札→大きい字の順に出す
  let pop=null,psh=null;
