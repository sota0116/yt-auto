<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- 試作（2026-11-17）：千年こよみ向け 3D カット。金の宝珠が回り、カメラが寄る。
         ライブラリは assets/lib の写し（GSAP 3.14.2・three r185）。ネットに取りに行かない -->
    <script src="assets/lib/gsap-3.14.2.min.js"></script>
    <style>
      :root {
        --ground: #070914;
        --ink: #fff6dc;
        --gold: #f2c45a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Noto Sans JP", sans-serif;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #stage canvas { width: 1920px; height: 1080px; display: block; }
      #title {
        position: absolute;
        left: 0;
        right: 0;
        top: 760px;
        text-align: center;
        z-index: 3;
      }
      #title-text {
        display: inline-block;
        color: var(--ink);
        font-size: 104px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-shadow: 0 0 28px rgba(242, 196, 90, 0.85), 0 6px 0 #3a2508;
      }
      #sub {
        position: absolute;
        left: 0;
        right: 0;
        top: 650px;
        text-align: center;
        z-index: 3;
      }
      #sub-text {
        display: inline-block;
        color: var(--gold);
        font-size: 48px;
        font-weight: 700;
        letter-spacing: 0.3em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage" data-layout-ignore></div>
      <div id="sub" class="clip" data-start="2.2" data-duration="5.8" data-track-index="1">
        <span id="sub-text">昔から言われてきた</span>
      </div>
      <div id="title" class="clip" data-start="3" data-duration="5" data-track-index="2">
        <span id="title-text">金運がめぐる日</span>
      </div>
    </div>

    <script>
      // 3D の準備が終わるまで描き出しを待たせる
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let markReady;
      window.__hf.buildReady["three"] = new Promise((r) => (markReady = r));
      window.__hfMarkReady = () => markReady();

      // 字の動き（GSAP。時間の位置に置く）
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#sub-text", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.2);
      tl.fromTo(
        "#title-text",
        { opacity: 0, scale: 1.25, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power4.out" },
        3,
      );
      tl.fromTo("#title-text", { y: 0 }, { y: -10, duration: 4, ease: "sine.inOut" }, 3.7);
      window.__timelines["main"] = tl;
    </script>

    <script type="module">
      import * as THREE from "./assets/lib/three.module.min.js";

      const W = 1920, H = 1080, DUR = 8;
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      document.getElementById("stage").appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070914);
      scene.fog = new THREE.FogExp2(0x070914, 0.045);
      const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 100);

      // 光：暖かい主光・冷たい縁の光・弱い全体光
      scene.add(new THREE.AmbientLight(0x2a2f55, 0.9));
      const key = new THREE.DirectionalLight(0xffd59a, 3.2);
      key.position.set(4, 5, 6);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x6f8cff, 2.4);
      rim.position.set(-6, 2, -5);
      scene.add(rim);
      const glow = new THREE.PointLight(0xffb84d, 30, 12, 2);
      scene.add(glow);

      // 主役：金の宝珠（つるつるにしすぎない）
      const orb = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1.25, 6),
        new THREE.MeshStandardMaterial({ color: 0xe8b04a, metalness: 0.85, roughness: 0.42, emissive: 0x3a2200, emissiveIntensity: 0.6 }),
      );
      scene.add(orb);
      // 宝珠を巻く輪
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(2.1, 0.035, 16, 200),
        new THREE.MeshStandardMaterial({ color: 0xffd98a, metalness: 0.9, roughness: 0.35, emissive: 0x6b4300, emissiveIntensity: 0.8 }),
      );
      ring.rotation.x = Math.PI * 0.42;
      scene.add(ring);
      // 下の影
      const shadow = new THREE.Mesh(
        new THREE.CircleGeometry(1.6, 64),
        new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45 }),
      );
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = -1.9;
      scene.add(shadow);

      // 金の粒：位置はシード付きの乱数で一度だけ決め、時間で回す
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(1117);
      const N = 1400;
      const base = new Float32Array(N * 3);
      const speed = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        base[i * 3] = 2.4 + rnd() * 6.5;
        base[i * 3 + 1] = rnd() * Math.PI * 2;
        base[i * 3 + 2] = (rnd() - 0.5) * 6;
        speed[i] = 0.15 + rnd() * 0.35;
      }
      const pos = new Float32Array(N * 3);
      const pGeo = new THREE.BufferGeometry();
      pGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      const points = new THREE.Points(
        pGeo,
        new THREE.PointsMaterial({ color: 0xffd27a, size: 0.032, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending }),
      );
      scene.add(points);

      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const ease = (x) => x * x * (3 - 2 * x);

      function renderAt(t) {
        const u = ease(clamp01(t / DUR));
        // カメラ：遠くから宝珠へ寄る（回り込みより「寄る」を主に）
        const dist = 11 - 5.2 * u;
        const ang = -0.55 + 0.5 * u;
        camera.position.set(Math.sin(ang) * dist, 1.2 - 0.7 * u, Math.cos(ang) * dist);
        // 字が出たら宝珠を画面の上へ逃がす（字と重ねない）
        camera.lookAt(0, 0.35 - 0.35 * u - 1.1 * ease(clamp01((t - 2.4) / 2)), 0);

        orb.rotation.y = t * 0.6;
        orb.rotation.x = 0.25 + Math.sin(t * 0.7) * 0.08;
        orb.position.y = Math.sin(t * 1.1) * 0.12;
        ring.rotation.z = t * 0.45;
        glow.intensity = 22 + 14 * Math.sin(t * 1.6) ** 2;
        key.position.set(Math.cos(t * 0.3) * 6, 5, Math.sin(t * 0.3) * 6);

        for (let i = 0; i < N; i++) {
          const r = base[i * 3], th = base[i * 3 + 1] + t * speed[i] * 0.4;
          const y = base[i * 3 + 2] + Math.sin(t * speed[i] * 2 + i) * 0.15 + t * 0.12;
          pos[i * 3] = Math.cos(th) * r;
          pos[i * 3 + 1] = (((y + 3) % 6) + 6) % 6 - 3;
          pos[i * 3 + 2] = Math.sin(th) * r;
        }
        pGeo.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
      window.__hfMarkReady();
    </script>
  </body>
</html>
